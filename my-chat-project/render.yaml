services:
  - type: web
    name: neon-chat-backend
    runtime: node
    plan: standard
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATA_PROTECTION_SECRET
        sync: false
      - key: PUBLIC_API_BASE
        value: https://api.ykf000.com
      - key: APP_VERSION
        value: 2.4.8
      - key: SUPPORT_TELEGRAM
        value: "@YingYingUu"
      - key: COOKIE_DOMAIN
        value: ""
      - key: REQUIRE_CLOUDFLARE
        value: "false"
      - key: STRICT_CLIENT_ORIGIN
        value: "true"
      - key: REQUIRE_CLIENT_TEMPLATE_ID
        value: "true"
      - key: LEGACY_API_ENABLED
        value: "false"
      - key: REQUIRE_SUPER_ADMIN_TOTP
        value: "true"
      - key: CLOUDFLARE_ORIGIN_SECRET
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ANALYTICS_API_TOKEN
        sync: false
      - key: CLOUDFLARE_REALTIME_MONTHLY_QUOTA_GB
        value: 1000
      - key: CLOUDFLARE_ANALYTICS_CACHE_MINUTES
        value: 15
      - key: CHAT_RETENTION_HOURS
        value: 24
      - key: TOKEN_TTL_HOURS
        value: 24
      - key: MAX_IMAGE_MB
        value: 8
      - key: MAX_VIDEO_MB
        value: 25
      - key: MAX_CONVERSATIONS
        value: 1000
      - key: MAX_SSE_CONNECTIONS
        value: 500
      - key: DB_POOL_MAX
        value: 5
      - key: INSTANCE_MEMORY_MB
        value: 2048
      - key: INSTANCE_CPU_CORES
        value: 1
      - key: MAX_CONCURRENT_UPLOADS
        value: 4
      - key: QR_INCIDENT_WINDOW_MINUTES
        value: 10
      - key: QR_INCIDENT_REVIEW_THRESHOLD
        value: 3
      - key: ANOMALY_VISITOR_IP_10M
        value: 12
      - key: ANOMALY_VISITOR_TENANT_10M
        value: 120
      - key: ANOMALY_MESSAGES_CONVERSATION_10M
        value: 80
      - key: ANOMALY_MESSAGES_TENANT_10M
        value: 600
      - key: ANOMALY_ORIGIN_MISMATCH_10M
        value: 3
      - key: SECURITY_IP_BLOCK_HOURS
        value: 24
      - key: AUDIT_RETENTION_DAYS
        value: 90
      - key: SLOW_API_MS
        value: 1000
      - key: SLOW_QUERY_MS
        value: 500
      - key: LICENSE_DESKTOP_DEVICE_DEFAULT
        value: 3
      - key: LICENSE_MOBILE_DEVICE_DEFAULT
        value: 3
      - key: EXPIRED_TENANT_GRACE_DAYS
        value: 3
      - key: ACTIVE_CHAT_WINDOW_MINUTES
        value: 10
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_TOTP_SECRET
        sync: false
      - key: WEBRTC_TURN_URLS
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_KEY_API_TOKEN
        sync: false
      - key: CLOUDFLARE_TURN_TTL_SECONDS
        value: 86400
      - key: WEBRTC_STUN_URLS
        value: stun:stun.cloudflare.com:3478
      - key: CALL_RING_TIMEOUT_SECONDS
        value: 45
      - key: CALL_ACTIVE_TIMEOUT_SECONDS
        value: 43200
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: NEON_ORG_ID
        sync: false
      - key: CUSTOMER_SERVICE_TELEGRAM
        value: "@your_customer_service"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: TELEGRAM_ALLOWED_GROUP_IDS
        sync: false
      - key: NETLIFY_AUTH_TOKEN
        sync: false
